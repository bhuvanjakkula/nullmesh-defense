[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nullmesh"
version = "0.1.0"
description = "Defensive disruption-tolerant mesh networking reference prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "cryptography>=43,<47",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1"]

[project.scripts]
nullmesh = "nullmesh.main:cli"

[tool.setuptools.packages.find]
include = ["nullmesh*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
